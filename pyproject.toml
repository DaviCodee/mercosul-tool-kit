[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mercosultoolkit"
version = "0.1.0"
description = "Concentrador de documentos do Mercosul: um núcleo Python leve para gerar, validar, inspecionar e mascarar números de documentos oficiais, com adaptadores de CLI e API."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Davi Moreira" }]
keywords = ["cpf", "cnpj", "dni", "cuit", "rut", "ruc", "cedula", "mercosul", "documento", "validador", "toolkit"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
    "Topic :: Utilities",
]
dependencies = [
    "pydantic>=2.6",
]

[project.optional-dependencies]
cli = ["click>=8.1"]
api = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "httpx>=0.27",
]

[project.scripts]
mtk = "mercosultoolkit.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/mercosultoolkit"]

[tool.ruff]
src = ["src", "tests"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.ruff.lint.per-file-ignores]
# FastAPI usa File()/Form() como defaults (padrão do framework, não é bug).
"src/mercosultoolkit/api/app.py" = ["B008"]

[tool.mypy]
# Semântica 3.12 evita falha de parse em stubs de dependências transitivas;
# o runtime continua suportando 3.11+ e o ruff valida a sintaxe-alvo py311.
python_version = "3.12"
packages = ["mercosultoolkit"]
mypy_path = "src"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
